<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>SawDust</title>
<style>
  :root{
    --ink:#000; --bone:#F5F3EE; --steel:#9AA3AB; --orange:#FF6B2C;
    --orange-dim:#B8481A; --glass:rgba(10,12,14,.55); --ring:#3A4148;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;}
  html,body{height:100%; overscroll-behavior:none;}
  body{background:var(--ink); color:var(--bone); overflow:hidden; height:100dvh;
    font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;}

  /* ---------- full-bleed camera ---------- */
  video#cam{position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(var(--mir,1)) scale(var(--zoom,1)); transform-origin:center;
    background:#000;}
  canvas#comp{display:none;}
  .flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
    transition:opacity .45s;}

  /* ---------- top chrome ---------- */
  .top{position:fixed; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    z-index:5;}
  .chip{background:var(--glass); backdrop-filter:blur(10px); border-radius:999px;
    padding:7px 13px; font-size:12px; font-weight:700; letter-spacing:.08em;
    font-family:ui-monospace,Menlo,monospace; display:flex; align-items:center; gap:7px;
    border:1px solid rgba(255,255,255,.12);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--steel);}
  .dot.rec{background:var(--orange); animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{opacity:.3}}
  .lenchip{color:var(--bone);} .lenchip b{color:var(--orange);}
  button.icon{background:var(--glass); backdrop-filter:blur(10px); border:1px solid
    rgba(255,255,255,.12); color:var(--bone); width:38px; height:38px; border-radius:50%;
    font-size:16px; cursor:pointer;}

  /* ---------- zoom ---------- */
  .zoomrow{position:fixed; left:0; right:0; bottom:calc(132px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:10px; z-index:5;}
  .zoomrow button{background:var(--glass); backdrop-filter:blur(10px); border:none;
    color:var(--bone); border-radius:999px; padding:8px 14px; font-size:12px;
    font-weight:700; cursor:pointer; font-family:ui-monospace,Menlo,monospace;}
  .zoomrow button.on{color:var(--orange);}

  /* ---------- bottom bar ---------- */
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:0 30px calc(24px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between;}
  .gal{width:52px; height:52px; border-radius:12px; border:2px solid rgba(255,255,255,.6);
    background:#14181C center/cover no-repeat; cursor:pointer; overflow:hidden;}
  .gal video{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .shutterwrap{position:relative; width:86px; height:86px;}
  .bufring{position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(var(--orange) calc(var(--fill,0)*1turn), var(--ring) 0);}
  .bufring::after{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--ink);}
  button.shutter{position:absolute; inset:9px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #FF8A52, var(--orange) 62%, var(--orange-dim));
    color:#1A0D05; font-weight:800; letter-spacing:.12em; font-size:12px;
    box-shadow:0 4px 16px rgba(255,107,44,.4);}
  button.shutter:active{transform:scale(.93);}
  button.shutter:disabled{filter:grayscale(1) brightness(.55); box-shadow:none;}
  .flip{width:52px; height:52px; border-radius:50%; background:var(--glass);
    backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.15); color:var(--bone);
    font-size:22px; cursor:pointer;}
  .hintline{position:fixed; left:0; right:0; bottom:calc(112px + env(safe-area-inset-bottom));
    text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:10px;
    color:var(--steel); letter-spacing:.06em; z-index:5; text-shadow:0 1px 3px #000;}

  /* ---------- overlays ---------- */
  .sheet{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:20;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:30px; text-align:center;}
  .sheet.open{display:flex;}
  .wordmark{font-weight:800; letter-spacing:.16em; font-size:18px;}
  .wordmark em{font-style:normal; color:var(--orange);}
  .sheet p{color:var(--steel); font-size:14px; line-height:1.55; max-width:300px;}
  .stepper{display:flex; align-items:center; gap:26px;}
  .stepper button{width:58px; height:58px; border-radius:50%; border:1px solid
    rgba(255,255,255,.2); background:#14181C; color:var(--bone); font-size:26px; cursor:pointer;}
  .stepper .val{font-family:ui-monospace,Menlo,monospace; font-size:52px; font-weight:700;
    min-width:120px;}
  .stepper .val small{display:block; font-size:11px; color:var(--steel); letter-spacing:.14em;
    font-weight:400; margin-top:2px;}
  button.primary{background:linear-gradient(180deg,#FF8A52,var(--orange)); color:#1A0D05;
    border:none; border-radius:999px; padding:15px 42px; font-size:15px; font-weight:800;
    letter-spacing:.1em; cursor:pointer;}
  button.plain{background:none; border:none; color:var(--steel); font-size:14px;
    cursor:pointer; padding:10px;}
  .err{color:var(--orange); font-size:12px; max-width:300px; line-height:1.5;}

  /* gallery */
  #gallery{justify-content:flex-start; padding-top:calc(20px + env(safe-area-inset-top));}
  .galhead{display:flex; width:100%; max-width:520px; justify-content:space-between;
    align-items:center;}
  .cliplist{width:100%; max-width:520px; overflow-y:auto; display:flex;
    flex-direction:column; gap:14px; padding-bottom:30px;}
  .clipcard{background:#101418; border-radius:14px; padding:10px; text-align:left;}
  .clipcard video{width:100%; border-radius:10px; background:#000; max-height:280px;}
  .cliprow{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .clipmeta{font-size:12px; color:var(--steel); font-family:ui-monospace,Menlo,monospace;}
  a.dl{color:var(--orange); font-weight:700; text-decoration:none; font-size:13px; padding:6px;}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="comp"></canvas>
<div class="flash" id="flash"></div>

<div class="top">
  <div class="chip"><span class="dot" id="dot"></span><span id="statusText">OFF</span></div>
  <div class="chip lenchip" id="lenChip" style="display:none">◷ <b id="lenLabel">20s</b></div>
  <button class="icon" id="micBtn" style="display:none" title="Mic">🎙</button>
</div>

<div class="zoomrow" id="zoomRow" style="display:none">
  <button data-z="1" class="on">1×</button>
  <button data-z="2">2×</button>
  <button data-z="3">3×</button>
</div>
<div class="hintline" id="hint"></div>

<div class="bar" id="bar" style="display:none">
  <div class="gal" id="galBtn"></div>
  <div class="shutterwrap">
    <div class="bufring" id="bufring"></div>
    <button class="shutter" id="clipBtn" disabled>CLIP</button>
  </div>
  <button class="flip" id="flipBtn">⟳</button>
</div>

<!-- setup: clip length must be chosen BEFORE arming -->
<div class="sheet open" id="setup">
  <div class="wordmark">SAW<em>DUST</em></div>
  <p>Set your clip length first. This is how far into the <b>past</b> every clip reaches.
  You can't change it accidentally once armed.</p>
  <div class="stepper">
    <button id="lenMinus">−</button>
    <div class="val"><span id="lenVal">20</span><small>SECONDS</small></div>
    <button id="lenPlus">＋</button>
  </div>
  <button class="primary" id="armBtn">ARM CAMERA</button>
  <div class="err" id="errText"></div>
</div>

<!-- deliberate-change flow for clip length -->
<div class="sheet" id="confirmLen">
  <p><b style="color:var(--bone)">Change clip length?</b><br><br>
  This resets the buffer — you'll lose the last <span id="curLen">20</span> seconds
  of captured past and the ring refills from zero.</p>
  <div class="stepper">
    <button id="cMinus">−</button>
    <div class="val"><span id="cVal">20</span><small>SECONDS</small></div>
    <button id="cPlus">＋</button>
  </div>
  <button class="primary" id="applyLen">RESET &amp; APPLY</button>
  <button class="plain" id="cancelLen">Keep current</button>
</div>

<!-- gallery -->
<div class="sheet" id="gallery">
  <div class="galhead">
    <div class="wordmark" style="font-size:14px">CLIPS <em id="clipCount">0</em></div>
    <button class="plain" id="closeGal">Close ✕</button>
  </div>
  <div class="cliplist" id="clipList"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam=$("cam"), comp=$("comp"), ctx=comp.getContext("2d");
  let camStream=null, micStream=null, composed=null, drawReq=null;
  let facing="environment", micOn=true, zoom=1, lookback=20, armed=false;
  let recs=[null,null], clipSeq=0, uiTimer=null, lastClipURL=null;

  const mime = ["video/mp4","video/webm;codecs=vp9,opus","video/webm"]
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";

  /* ---------- compositor: recorders watch the CANVAS, never the camera.
     Flipping cameras just changes what's drawn — the buffer never resets. */
  function drawLoop(){
    if(cam.readyState >= 2){
      const vw=cam.videoWidth, vh=cam.videoHeight;
      if(vw && (comp.width!==Math.min(vw,1280))){
        const scale=Math.min(1, 1280/vw);
        comp.width=Math.round(vw*scale); comp.height=Math.round(vh*scale);
      }
      const sw=vw/zoom, sh=vh/zoom, sx=(vw-sw)/2, sy=(vh-sh)/2;
      ctx.drawImage(cam, sx, sy, sw, sh, 0, 0, comp.width, comp.height);
    }
    drawReq = requestAnimationFrame(drawLoop);
  }

  /* ---------- ring buffer: two staggered recorders on the composed stream */
  function makeSlot(){
    const r = new MediaRecorder(composed, mime ? {mimeType:mime} : undefined);
    const slot = {rec:r, chunks:[], born:Date.now(), save:false};
    r.ondataavailable = e => { if(e.data && e.data.size) slot.chunks.push(e.data); };
    r.onstop = () => { if(slot.save)
      addClip(new Blob(slot.chunks,{type:mime||"video/webm"}), (Date.now()-slot.born)/1000); };
    r.start(1000);
    return slot;
  }
  const age = s => s ? (Date.now()-s.born)/1000 : -1;

  function startBuffering(){
    stopBuffering();
    recs[0]=makeSlot();
    recs._stag=setTimeout(()=>{ if(armed) recs[1]=makeSlot(); }, lookback*1000);
    recs._rot=setInterval(()=>{
      recs.forEach((s,i)=>{
        if(s && age(s)>=lookback*2 && recs.filter(x=>x&&age(x)>=lookback).length>1){
          s.save=false; s.rec.stop(); recs[i]=makeSlot();
        }
      });
    },1000);
    $("clipBtn").disabled=false; $("dot").classList.add("rec");
    $("statusText").textContent="ARMED";
    uiTimer=setInterval(()=>{
      const best=Math.max(age(recs[0]),age(recs[1]));
      $("bufring").style.setProperty("--fill",Math.min(best/lookback,1));
      $("hint").textContent = best<lookback
        ? `buffer ${Math.floor(best)}s / ${lookback}s`
        : `CLIP saves exactly the last ${lookback}s`;
    },250);
  }
  function stopBuffering(){
    clearTimeout(recs._stag); clearInterval(recs._rot); clearInterval(uiTimer);
    recs.forEach(s=>{ if(s&&s.rec.state!=="inactive"){s.save=false; s.rec.stop();} });
    recs=[null,null];
  }

  function doClip(){
    const i = age(recs[0])>=age(recs[1]) ? 0 : 1;
    const slot=recs[i]; if(!slot) return;
    slot.save=true;
    if(slot.rec.state!=="inactive") slot.rec.stop();
    recs[i]=makeSlot();
    $("flash").style.opacity=.65;
    requestAnimationFrame(()=>setTimeout(()=>$("flash").style.opacity=0,60));
  }

  async function addClip(blob, secs){
    clipSeq++;
    const card=document.createElement("div");
    card.className="clipcard";
    card.innerHTML=`<div class="clipmeta" style="padding:14px 4px">CLIP ${clipSeq} · ${
      secs > lookback + 0.75 ? `processing to exactly ${lookback}s…` : "saving…"}</div>`;
    $("clipList").prepend(card);
    $("clipCount").textContent=clipSeq;
    let final=blob, finalSecs=secs;
    if(secs > lookback + 0.75){
      try{ ({blob:final, secs:finalSecs} = await trimTo(blob, lookback)); }
      catch(e){ /* trim failed — keep the untrimmed original rather than lose it */ }
    }
    const url=URL.createObjectURL(final); lastClipURL=url;
    card.innerHTML=`
      <video src="${url}" playsinline controls preload="metadata"></video>
      <div class="cliprow">
        <div class="clipmeta">CLIP ${clipSeq} · ${finalSecs.toFixed(1)}s ·
          ${(final.size/1048576).toFixed(1)} MB · ${new Date().toLocaleTimeString()}</div>
        <a class="dl" href="${url}" download="sawdust_${clipSeq}.${ext}">Save</a>
      </div>`;
    $("galBtn").innerHTML=`<video src="${url}#t=0.1" muted playsinline preload="metadata"></video>`;
  }

  /* ---------- exact-length trim: replay the tail of the buffer file and
     re-record precisely `target` seconds (video via canvas, audio via decode) */
  let audioCtx=null;
  async function trimTo(srcBlob, target){
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") await audioCtx.resume();
    const url=URL.createObjectURL(srcBlob);
    const v=document.createElement("video");
    v.src=url; v.muted=true; v.playsInline=true; v.preload="auto";
    await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=rej; });
    // some browsers report Infinity duration on recorded blobs — force it out
    if(!isFinite(v.duration)){
      v.currentTime=1e7;
      await new Promise(res=>{ v.onseeked=res; });
    }
    const dur=v.duration;
    const start=Math.max(0, dur-target);
    // decoded audio (raw, unprocessed — matches the mic settings)
    let audioTrack=null, srcNode=null;
    try{
      const buf=await audioCtx.decodeAudioData(await srcBlob.arrayBuffer());
      const dest=audioCtx.createMediaStreamDestination();
      srcNode=audioCtx.createBufferSource(); srcNode.buffer=buf; srcNode.connect(dest);
      audioTrack=dest.stream.getAudioTracks()[0];
    }catch(e){ /* no decodable audio — trim video only */ }
    v.currentTime=start;
    await new Promise(res=>{ v.onseeked=res; });
    const tc=document.createElement("canvas");
    tc.width=v.videoWidth||comp.width; tc.height=v.videoHeight||comp.height;
    const tctx=tc.getContext("2d");
    let going=true;
    (function loop(){ if(!going) return;
      tctx.drawImage(v,0,0,tc.width,tc.height); requestAnimationFrame(loop); })();
    const stream=tc.captureStream(30);
    if(audioTrack) stream.addTrack(audioTrack);
    const chunks=[];
    const rec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const done=new Promise(res=>{ rec.onstop=res; });
    rec.start(500);
    await v.play();
    if(srcNode) srcNode.start(0, start, target);
    await new Promise(res=>setTimeout(res, target*1000));
    rec.stop(); going=false; v.pause();
    await done;
    URL.revokeObjectURL(url);
    return {blob:new Blob(chunks,{type:mime||"video/webm"}), secs:target};
  }

  /* ---------- camera plumbing ---------- */
  async function getCam(face){
    return navigator.mediaDevices.getUserMedia({
      video:{facingMode:face, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  }
  async function arm(){
    $("errText").textContent="";
    try{
      camStream = await getCam(facing);
      micStream = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
      micStream.getAudioTracks().forEach(t=>t.enabled=micOn);
      cam.srcObject=camStream;
      await new Promise(res=>{ cam.onloadedmetadata=res; });
      document.body.style.setProperty("--mir", facing==="user"?-1:1);
      drawLoop();
      composed = new MediaStream([
        comp.captureStream(30).getVideoTracks()[0],
        micStream.getAudioTracks()[0]
      ]);
      armed=true;
      $("setup").classList.remove("open");
      $("bar").style.display="flex"; $("zoomRow").style.display="flex";
      $("lenChip").style.display="flex"; $("micBtn").style.display="block";
      $("lenLabel").textContent=lookback+"s";
      startBuffering();
    }catch(e){
      $("errText").textContent="Camera blocked ("+e.name+"). This page needs https or "+
        "localhost, and camera + mic permission.";
    }
  }
  // flip WITHOUT re-arming: swap the drawn source only
  async function flip(){
    const target = facing==="environment" ? "user" : "environment";
    try{
      const next = await getCam(target);
      const old = camStream;
      cam.srcObject = next;
      await new Promise(res=>{ cam.onloadedmetadata=res; });
      camStream = next; facing = target;
      document.body.style.setProperty("--mir", facing==="user"?-1:1);
      old && old.getTracks().forEach(t=>t.stop());
      // recorders untouched — buffer and fill ring carry straight through
    }catch(e){ /* device may lack that camera; stay put */ }
  }

  /* ---------- UI wiring ---------- */
  const clampLen = v => Math.max(5, Math.min(60, v));
  $("lenMinus").onclick=()=>{ lookback=clampLen(lookback-5); $("lenVal").textContent=lookback; };
  $("lenPlus").onclick =()=>{ lookback=clampLen(lookback+5); $("lenVal").textContent=lookback; };
  $("armBtn").onclick=arm;
  $("clipBtn").onclick=doClip;
  $("flipBtn").onclick=flip;
  $("micBtn").onclick=()=>{ micOn=!micOn;
    micStream && micStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    $("micBtn").style.opacity = micOn?1:.4; };

  // zoom chips + pinch (digital zoom is baked into the recording via canvas crop)
  const zoomBtns=[...document.querySelectorAll(".zoomrow button")];
  function setZoom(z){
    zoom=Math.max(1,Math.min(5,z));
    document.body.style.setProperty("--zoom",zoom);
    zoomBtns.forEach(b=>b.classList.toggle("on", +b.dataset.z===Math.round(zoom)));
  }
  zoomBtns.forEach(b=>b.onclick=()=>setZoom(+b.dataset.z));
  let pinchD=0, pinchZ=1;
  addEventListener("touchstart",e=>{ if(e.touches.length===2){
    pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                      e.touches[0].clientY-e.touches[1].clientY); pinchZ=zoom; }},{passive:true});
  addEventListener("touchmove",e=>{ if(e.touches.length===2 && pinchD){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
    setZoom(pinchZ*(d/pinchD)); }},{passive:true});

  // clip-length change: deliberate two-step flow, warns about buffer reset
  let pendLen=20;
  $("lenChip").onclick=()=>{ pendLen=lookback;
    $("curLen").textContent=lookback; $("cVal").textContent=pendLen;
    $("confirmLen").classList.add("open"); };
  $("cMinus").onclick=()=>{ pendLen=clampLen(pendLen-5); $("cVal").textContent=pendLen; };
  $("cPlus").onclick =()=>{ pendLen=clampLen(pendLen+5); $("cVal").textContent=pendLen; };
  $("cancelLen").onclick=()=>$("confirmLen").classList.remove("open");
  $("applyLen").onclick=()=>{
    lookback=pendLen; $("lenLabel").textContent=lookback+"s";
    $("confirmLen").classList.remove("open");
    startBuffering();  // only place the buffer intentionally resets
  };

  // gallery
  $("galBtn").onclick=()=>$("gallery").classList.add("open");
  $("closeGal").onclick=()=>$("gallery").classList.remove("open");

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden && armed){
      armed=false; stopBuffering(); cancelAnimationFrame(drawReq);
      [camStream,micStream].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));
      camStream=micStream=null;
      $("dot").classList.remove("rec"); $("statusText").textContent="OFF";
      $("clipBtn").disabled=true; $("bufring").style.setProperty("--fill",0);
      $("setup").classList.add("open");
      $("errText").textContent="Camera released while backgrounded — arm again.";
    }
  });
  if(!window.MediaRecorder){
    $("errText").textContent="This browser doesn't support MediaRecorder.";
    $("armBtn").disabled=true;
  }
})();
</script>
</body>
</html>
